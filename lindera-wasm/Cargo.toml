[package]
name = "lindera-wasm"
# Distributed via npm, not crates.io.
publish = false
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "A morphological analysis library for WebAssembly."
documentation = "https://docs.rs/lindera-wasm"
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"
keywords = ["morphological", "analysis", "library", "wasm", "webassembly"]
categories = ["text-processing"]
license = { workspace = true }

[lib]
crate-type = ["cdylib"]

[features]
embed-ipadic = ["lindera/embed-ipadic"] # Embed IPADIC dictionary (Japanese)
embed-unidic = ["lindera/embed-unidic"] # Embed UniDic dictionary (Japanese)
embed-sudachidict = [
    "lindera/embed-sudachidict",
] # Embed SudachiDict dictionary (Japanese)
embed-ko-dic = ["lindera/embed-ko-dic"] # Embed ko-dic dictionary (Korean)
embed-cc-cedict = [
    "lindera/embed-cc-cedict",
] # Embed CC-CEDICT dictionary (Chinese)
embed-jieba = ["lindera/embed-jieba"] # Embed Jieba dictionary (Chinese)
embed-cjk = [
    "lindera/embed-cjk",
] # Embed CJK dictionaries (IPADIC, ko-dic, Jieba)
dependency = [
    "lindera-binding/dependency",
] # The token filter japanese_dependency (bunsetsu dependency analysis)
embed-dependency-ipadic = [
    "dependency",
    "lindera-binding/embed-dependency-ipadic",
] # Embed the model of the token filter japanese_dependency for IPADIC
embed-dependency-unidic = [
    "dependency",
    "lindera-binding/embed-dependency-unidic",
] # Embed the model of the token filter japanese_dependency for UniDic
embed-dependency-unidic-cwj = [
    "dependency",
    "lindera-binding/embed-dependency-unidic-cwj",
] # Embed the model of the token filter japanese_dependency for UniDic CWJ
embed-dependency-unidic-csj = [
    "dependency",
    "lindera-binding/embed-dependency-unidic-csj",
] # Embed the model of the token filter japanese_dependency for UniDic CSJ
# `dependency` is in the default build since 7.1.0 (#1440): the code of the
# token filter japanese_dependency, without a model, which a user downloads.
default = ["dependency"]

[dependencies]
js-sys = "0.3.103"
lindera = { workspace = true }
lindera-binding = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = { workspace = true }
wasm-bindgen = { version = "0.2.126" }

[dev-dependencies]
serde_json = { workspace = true }
wasm-bindgen = { version = "0.2.126" }
wasm-bindgen-test = "0.3.76"
