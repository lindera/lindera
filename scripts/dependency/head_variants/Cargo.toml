# Measures the head word of variants of the schema of a dictionary against
# the content head of a corpus, with `corpus::convert`: the tables
# "Agreement with UD Japanese-GSD" of the documentation of
# lindera-dependency. The dictionary is the embedded IPADIC, or the one of
# `--dict`, such as a directory with UniDic.
#
# Not a member of the lindera workspace (it has a workspace of its own), not
# built by CI and not published. Run it from the root of the repository:
#
#   cargo run --release --manifest-path scripts/dependency/head_variants/Cargo.toml -- \
#       scripts/dependency/data/gsd/ja_gsd-ud-train.conllu
[package]
name = "head_variants"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
lindera-dependency = { path = "../../../lindera-dependency", features = ["train"] }
lindera-segmenter = { path = "../../../lindera-segmenter", features = ["embed-ipadic"] }
