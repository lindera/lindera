# Measures a model file of lindera-dependency: its size, the time to read
# it, and the sentences per second of chunking, with the chunker read on the
# bytes of the file and with the same chunker in memory. The numbers of
# "Model file" in the design notes of lindera-dependency.
#
# Not a member of the lindera workspace (it has a workspace of its own), not
# built by CI and not published. Run it from the root of the repository:
#
#   cargo run --release --manifest-path scripts/dependency/model_speed/Cargo.toml -- \
#       scripts/dependency/data/lattice/ja_gsd-ud-train.lattice \
#       scripts/dependency/data/lattice/ja_gsd-ud-train.lattice 7
[package]
name = "model_speed"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
lindera-dependency = { path = "../../../lindera-dependency", features = ["train"] }

# As the release profile of the lindera workspace.
[profile.release]
lto = true
