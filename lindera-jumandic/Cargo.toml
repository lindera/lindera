[package]
name = "lindera-jumandic"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "A Japanese morphological dictionary for JUMAN (mecab-jumandic)."
documentation = "https://docs.rs/lindera-jumandic"
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"
keywords = ["morphological", "analysis", "dictionary", "japanese", "juman"]
categories = { workspace = true }
license = { workspace = true }

[features]
embed-jumandic = [] # Embed the JUMAN dictionary in the binary

[dependencies]
lindera-dictionary = { workspace = true }

[build-dependencies]
lindera-dictionary = { workspace = true, features = ["build_rs"] }
