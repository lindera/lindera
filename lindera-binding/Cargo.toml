[package]
name = "lindera-binding"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Shared FFI-independent helpers for the Lindera language bindings."
documentation = "https://docs.rs/lindera-binding"
homepage = { workspace = true }
repository = { workspace = true }
keywords = ["morphological", "analysis", "binding"]
categories = { workspace = true }
license = { workspace = true }

[features]
# Dictionary-embedding pass-throughs, used only by feature-gated tests and
# benches in this crate; the bindings enable embedding via their own crates.
embed-ipadic = ["lindera/embed-ipadic"]
embed-ko-dic = ["lindera/embed-ko-dic"]
# The token filter japanese_dependency (#1438): the bindings forward their
# own `dependency` feature here, which is in their default builds (#1440).
# Not in the default build of this crate.
dependency = ["lindera/dependency"]
# The model of that filter for IPADIC, embedded in the build (#1440).
embed-dependency-ipadic = ["dependency", "lindera/embed-dependency-ipadic"]
# The same for the models for the three UniDic dictionaries (#1441).
embed-dependency-unidic = ["dependency", "lindera/embed-dependency-unidic"]
embed-dependency-unidic-cwj = ["dependency", "lindera/embed-dependency-unidic-cwj"]
embed-dependency-unidic-csj = ["dependency", "lindera/embed-dependency-unidic-csj"]

[dependencies]
lindera = { workspace = true, features = ["analysis"] }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = [
    "html_reports",
] }
tempfile = "3.27.0"

[[bench]]
name = "bench_binding_ipadic"
harness = false
required-features = ["embed-ipadic"]
