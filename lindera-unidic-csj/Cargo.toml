description = "A Japanese morphological dictionary for UniDic for contemporary spoken Japanese (UniDic CSJ)."
documentation = "https://docs.rs/lindera-unidic-csj"
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"
