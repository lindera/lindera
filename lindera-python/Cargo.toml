[package]
name = "lindera-python"
# Distributed via PyPI, not crates.io.
publish = false
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "A Python binding for Lindera."
documentation = "https://docs.rs/lindera-python"
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"
keywords = ["morphological", "analysis", "library", "python", "binding"]
categories = { workspace = true }
license = { workspace = true }

[lib]
name = "lindera"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[features]
embed-ipadic = ["lindera/embed-ipadic"] # Include Japanese dictionary (IPADIC)
embed-ipadic-neologd = [
    "lindera/embed-ipadic-neologd",
] # Include Japanese dictionary (IPADIC NEologd)
embed-unidic = ["lindera/embed-unidic"] # Include Japanese dictionary (UniDic)
embed-unidic-cwj = [
    "lindera/embed-unidic-cwj",
] # Include Japanese dictionary (UniDic CWJ)
embed-unidic-csj = [
    "lindera/embed-unidic-csj",
] # Include Japanese dictionary (UniDic CSJ)
embed-sudachidict = [
    "lindera/embed-sudachidict",
] # Include Japanese dictionary (SudachiDict)
embed-ko-dic = ["lindera/embed-ko-dic"] # Include Korean dictionary (ko-dic)
embed-cc-cedict = [
    "lindera/embed-cc-cedict",
] # Include Chinese dictionary (CC-CEDICT)
embed-jieba = ["lindera/embed-jieba"] # Include Chinese dictionary (Jieba)
embed-cjk = [
    "lindera/embed-cjk",
] # Embed CJK dictionaries (IPADIC, ko-dic, Jieba)
train = ["lindera/train"] # Enable training functionality
dependency = [
    "lindera-binding/dependency",
] # The token filter japanese_dependency (bunsetsu dependency analysis)
embed-dependency-ipadic = [
    "dependency",
    "lindera-binding/embed-dependency-ipadic",
] # Embed the model of the token filter japanese_dependency for IPADIC
embed-dependency-unidic = [
    "dependency",
    "lindera-binding/embed-dependency-unidic",
] # Embed the model of the token filter japanese_dependency for UniDic
embed-dependency-unidic-cwj = [
    "dependency",
    "lindera-binding/embed-dependency-unidic-cwj",
] # Embed the model of the token filter japanese_dependency for UniDic CWJ
embed-dependency-unidic-csj = [
    "dependency",
    "lindera-binding/embed-dependency-unidic-csj",
] # Embed the model of the token filter japanese_dependency for UniDic CSJ
# `dependency` is in the default build since 7.1.0 (#1440): the code of the
# token filter japanese_dependency, without a model, which a user downloads.
default = ["train", "dependency"] # No dictionary and no model included

[dependencies]
lindera = { workspace = true }
lindera-binding = { workspace = true }
num_cpus = { workspace = true }
pyo3 = { version = "0.30.1", features = [
    "extension-module",
    "abi3-py310",
    "generate-import-lib",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
