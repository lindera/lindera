AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1
  SuggestExtensions: false

Style/Documentation:
  Exclude:
    - "test/**/*"

Metrics/AbcSize:
  Exclude:
    - "test/**/*"

# Tests define their cases in blocks and classes, and examples spell out their
# input data, so the length limits are for the library code.
Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "examples/**/*"

Metrics/ClassLength:
  Exclude:
    - "test/**/*"

Metrics/MethodLength:
  Exclude:
    - "test/**/*"
    - "examples/**/*"
