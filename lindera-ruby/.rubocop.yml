AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1
  SuggestExtensions: false

# The cop asks the gemspec to set `rubygems_mfa_required`, which requires every
# owner of the gem to have MFA on RubyGems and, depending on their MFA level,
# an OTP for each push. That is a decision about how releases are published
# (release.yml pushes with an API key and passes no OTP), not a style fix
# (#1251).
Gemspec/RequireMFA:
  Enabled: false

Style/Documentation:
  Exclude:
    - "test/**/*"

Metrics/AbcSize:
  Exclude:
    - "test/**/*"

# Tests define their cases in blocks and classes, and examples spell out their
# input data, so the length limits are for the library code.
Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "examples/**/*"

Metrics/ClassLength:
  Exclude:
    - "test/**/*"

Metrics/MethodLength:
  Exclude:
    - "test/**/*"
    - "examples/**/*"
