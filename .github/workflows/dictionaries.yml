name: Dictionaries

# Builds the seven official dictionaries from source, packs each into the
# archive that its crate's prebuilt.json pins, and checks it against the
# published one; run by hand with `publish`, it publishes the archives whose
# release does not exist yet (#1336). The steps of a release are in
# docs/src/development/dictionary_release.md.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the dictionaries whose release does not exist yet (on main only)"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "lindera-dictionary/**"
      - "lindera-ipadic/**"
      - "lindera-ipadic-neologd/**"
      - "lindera-unidic/**"
      - "lindera-sudachidict/**"
      - "lindera-ko-dic/**"
      - "lindera-cc-cedict/**"
      - "lindera-jieba/**"
      # A dependency upgrade can change what the builder writes.
      - "Cargo.lock"
      - ".github/workflows/dictionaries.yml"
  pull_request:
    types: [opened, synchronize]
    paths:
      - "lindera-dictionary/**"
      - "lindera-ipadic/**"
      - "lindera-ipadic-neologd/**"
      - "lindera-unidic/**"
      - "lindera-sudachidict/**"
      - "lindera-ko-dic/**"
      - "lindera-cc-cedict/**"
      - "lindera-jieba/**"
      - "Cargo.lock"
      - ".github/workflows/dictionaries.yml"

permissions:
  contents: read

concurrency:
  group: dictionaries-${{ github.ref }}
  # Never cancel a run that may be publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - lindera-ipadic
          - lindera-ipadic-neologd
          - lindera-unidic
          - lindera-sudachidict
          - lindera-ko-dic
          - lindera-cc-cedict
          - lindera-jieba
    env:
      CRATE: ${{ matrix.crate }}
      CACHE_DIR: ${{ github.workspace }}/../dictionary-cache
      STAGE_DIR: ${{ github.workspace }}/../dictionary-stage
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Read the pin
        id: pin
        run: |
          key=$(jq -r '.key' "$CRATE/prebuilt.json")
          sha256=$(jq -r '.sha256 // ""' "$CRATE/prebuilt.json")
          url="$(jq -r '.base_url | rtrimstr("/")' "$CRATE/prebuilt.json")/$(jq -r '.path | ltrimstr("/")' "$CRATE/prebuilt.json")"
          {
            echo "key=$key"
            echo "sha256=$sha256"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"

      # The crate's build script builds the dictionary from source into the
      # cache directory, at <dir>/<crate version>-fmt<format version>/<crate>.
      - name: Build from source
        env:
          LINDERA_BUILD_DICTIONARY_FROM_SOURCE: "1"
          LINDERA_BUILD_DICTIONARY_CACHE_DIR: ${{ env.CACHE_DIR }}
        run: cargo build --locked -p "$CRATE" --features "embed-${CRATE#lindera-}"

      # The archive holds one directory named after the key, with the nine
      # files that the crate embeds and NOTICE.txt. Sorted names, a fixed
      # time and owner, and gzip without a name or time make it the same for
      # the same files.
      - name: Pack the dictionary
        id: pack
        env:
          KEY: ${{ steps.pin.outputs.key }}
        run: |
          built=$(find "$CACHE_DIR" -mindepth 2 -maxdepth 2 -type d -name "$CRATE")
          if [ -z "$built" ]; then
            echo "::error::the build left no dictionary in $CACHE_DIR"
            exit 1
          fi
          mkdir -p "$STAGE_DIR/$KEY"
          for file in char_def.bin matrix.mtx dict.trie dict.valsidx dict.vals dict.wordsidx dict.words unk.bin metadata.json; do
            cp "$built/$file" "$STAGE_DIR/$KEY/"
          done
          cp "$CRATE/NOTICE.txt" "$STAGE_DIR/$KEY/"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --format=gnu \
            -C "$STAGE_DIR" -cf - "$KEY" | gzip -n -9 > "$KEY.tar.gz"
          sha256=$(sha256sum "$KEY.tar.gz" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### $KEY"
            echo
            echo "Archive \`$KEY.tar.gz\`: \`$sha256\`"
            echo
            echo '| File | SHA-256 |'
            echo '| --- | --- |'
            for file in "$STAGE_DIR/$KEY"/*; do
              echo "| $(basename "$file") | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Byte for byte, except lindera_version in metadata.json: it names the
      # Lindera version that built the dictionary, which the published one
      # keeps when Lindera moves on.
      - name: Check against the published dictionary
        if: steps.pin.outputs.sha256 != ''
        env:
          KEY: ${{ steps.pin.outputs.key }}
          SHA256: ${{ steps.pin.outputs.sha256 }}
          URL: ${{ steps.pin.outputs.url }}
        run: |
          curl -fsSL --retry 3 -o published.tar.gz "$URL"
          echo "$SHA256  published.tar.gz" | sha256sum -c -
          mkdir published
          tar -xzf published.tar.gz -C published
          status=0
          for file in char_def.bin matrix.mtx dict.trie dict.valsidx dict.vals dict.wordsidx dict.words unk.bin; do
            if ! cmp -s "$STAGE_DIR/$KEY/$file" "published/$KEY/$file"; then
              echo "::error::$file differs from the published dictionary $KEY"
              status=1
            fi
          done
          if ! cmp -s <(jq -S 'del(.lindera_version)' "$STAGE_DIR/$KEY/metadata.json") \
                      <(jq -S 'del(.lindera_version)' "published/$KEY/metadata.json"); then
            echo "::error::metadata.json differs from the published dictionary $KEY, apart from lindera_version"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::the build from source differs from the published dictionary $KEY: give it a new revision in $CRATE/prebuilt.json, clear its sha256, and publish it (docs/src/development/dictionary_release.md)"
          fi
          exit "$status"

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.crate }}
          path: ${{ steps.pin.outputs.key }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          path: archives

      # A release is never replaced: published crates pin its archive. One
      # that exists is reported, with a warning when the archive built now
      # differs from it.
      - name: Publish the missing releases
        run: |
          {
            echo "### Releases"
            echo
            echo '| Crate | Key | SHA-256 | Release |'
            echo '| --- | --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for pin in lindera-*/prebuilt.json; do
            crate=$(dirname "$pin")
            key=$(jq -r '.key' "$pin")
            tag="dictionary-$key"
            archive="archives/$crate/$key.tar.gz"
            sha256=$(sha256sum "$archive" | cut -d' ' -f1)
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              published=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq ".assets[] | select(.name == \"$key.tar.gz\") | .digest")
              if [ "$published" != "sha256:$sha256" ]; then
                echo "::warning::$tag exists with $published, and the archive built now has sha256:$sha256"
              fi
              echo "| $crate | $key | \`${published#sha256:}\` | exists |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            gh release create "$tag" "$archive" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --latest=false \
              --title "Dictionary $key" \
              --notes "The ${crate#lindera-} dictionary built from source at $GITHUB_SHA, which $crate embeds once its prebuilt.json pins this SHA-256: $sha256"
            published=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq ".assets[] | select(.name == \"$key.tar.gz\") | .digest")
            if [ "$published" != "sha256:$sha256" ]; then
              echo "::error::$tag reports $published, and the uploaded archive has sha256:$sha256"
              exit 1
            fi
            echo "| $crate | $key | \`$sha256\` | created |" >> "$GITHUB_STEP_SUMMARY"
          done
