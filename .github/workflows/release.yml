name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt

      - name: Run format
        run: cargo fmt --all -- --check

  test-lindera-crf:
    name: Test lindera-crf
    needs: [format]
    uses: ./.github/workflows/test-crate.yml
    with:
      crate: lindera-crf
      cache: true

  test-lindera-dictionary:
    name: Test lindera-dictionary (${{ matrix.platform.target }})
    needs: [format, test-lindera-crf]
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    uses: ./.github/workflows/test-crate.yml
    with:
      crate: lindera-dictionary
      target: ${{ matrix.platform.target }}
      runs-on: ${{ matrix.platform.runner }}
      cache: true
      cache-key: ${{ matrix.platform.target }}

  test-lindera-trainer:
    name: Test lindera-trainer
    needs: [format, test-lindera-dictionary]
    uses: ./.github/workflows/test-crate.yml
    with:
      crate: lindera-trainer
      cache: true

  test-lindera-ipadic:
    name: Test lindera-ipadic
    needs: [test-lindera-dictionary]
    uses: ./.github/workflows/test-crate.yml
    with:
      crate: lindera-ipadic
      features: "--features embed-ipadic"
      cache: true

  test-lindera-ipadic-neologd:
    name: Test lindera-ipadic-neologd
    needs: [test-lindera-dictionary]
    uses: ./.github/workflows/test-crate.yml
    with:
      crate: lindera-ipadic-neologd
      features: "--features embed-ipadic-neologd"
      cache: true
      free-disk-space: true

  test-lindera-unidic:
    name: Test lindera-unidic
    needs: [test-lindera-dictionary]
    uses: ./.github/workflows/test-crate.yml
    with:
      crate: lindera-unidic
      features: "--features embed-unidic"
      cache: true
      free-disk-space: true

  test-lindera-sudachidict:
    name: Test lindera-sudachidict
    needs: [test-lindera-dictionary]
    uses: ./.github/workflows/test-crate.yml
    with:
      crate: lindera-sudachidict
      features: "--features embed-sudachidict"
      cache: true
      free-disk-space: true

  test-lindera-ko-dic:
    name: Test lindera-ko-dic
    needs: [test-lindera-dictionary]
    uses: ./.github/workflows/test-crate.yml
    with:
      crate: lindera-ko-dic
      features: "--features embed-ko-dic"
      cache: true

  test-lindera-cc-cedict:
    name: Test lindera-cc-cedict
    needs: [test-lindera-dictionary]
    uses: ./.github/workflows/test-crate.yml
    with:
      crate: lindera-cc-cedict
      features: "--features embed-cc-cedict"
      cache: true

  test-lindera-jieba:
    name: Test lindera-jieba
    needs: [test-lindera-dictionary]
    uses: ./.github/workflows/test-crate.yml
    with:
      crate: lindera-jieba
      features: "--features embed-jieba"
      cache: true

  test-lindera:
    name: Test lindera (${{ matrix.platform.target }})
    needs:
      - test-lindera-dictionary
      - test-lindera-trainer
      - test-lindera-ipadic
      - test-lindera-ipadic-neologd
      - test-lindera-unidic
      - test-lindera-sudachidict
      - test-lindera-ko-dic
      - test-lindera-cc-cedict
      - test-lindera-jieba
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    uses: ./.github/workflows/test-crate.yml
    with:
      crate: lindera
      features: "--features embed-ipadic,embed-ko-dic,train"
      target: ${{ matrix.platform.target }}
      runs-on: ${{ matrix.platform.runner }}
      cache: true
      cache-key: ${{ matrix.platform.target }}

  test-lindera-analysis:
    name: Test lindera-analysis
    needs: [test-lindera]
    uses: ./.github/workflows/test-crate.yml
    with:
      crate: lindera-analysis
      features: "--features embed-ipadic,embed-ko-dic"
      cache: true

  test-lindera-cli:
    name: Test lindera-cli
    needs: [test-lindera, test-lindera-analysis]
    uses: ./.github/workflows/test-crate.yml
    with:
      crate: lindera-cli
      features: "--features train,embed-ipadic"
      cache: true

  test-lindera-python:
    name: Test lindera-python
    needs: [test-lindera]
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Run Python test
        shell: bash
        run: |
          make test-lindera-python

  test-lindera-nodejs:
    name: Test lindera-nodejs
    needs: [test-lindera]
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run Node.js build
        run: |
          make test-lindera-nodejs

      # See the matching step in regression.yml: `napi build` regenerates the committed entry
      # points, so a diff here means a Rust API change landed without them.
      - name: Verify generated entry points are up to date
        working-directory: lindera-nodejs
        run: |
          if ! git diff --exit-code -- index.js index.d.ts; then
            echo "::error::index.js / index.d.ts are out of date. Run 'make test-lindera-nodejs' and commit the result."
            exit 1
          fi

  test-lindera-ruby:
    name: Test lindera-ruby
    needs: [test-lindera]
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: lindera-ruby

      - name: Run Ruby test
        shell: bash
        run: |
          make test-lindera-ruby

  test-lindera-php:
    name: Test lindera-php
    needs: [test-lindera]
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Run PHP test
        shell: bash
        run: |
          make test-lindera-php

  test-lindera-wasm:
    name: Test lindera-wasm
    needs: [test-lindera]
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run WASM test
        run: |
          make test-lindera-wasm

  create-release:
    name: Create Release
    needs:
      [
        test-lindera-cli,
        test-lindera-python,
        test-lindera-nodejs,
        test-lindera-ruby,
        test-lindera-php,
        test-lindera-wasm,
      ]
    # Tag pushes only. On a workflow_dispatch from a branch, tag_name would be
    # the branch name and action-gh-release would create a release and a tag
    # for it. Every build and publish job below needs this job (directly or
    # through a build job), so skipping it here also skips them; a dispatch is
    # then a dry run of the tests, build-php-binaries and build-python-sdist.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true

  build-dictionary:
    name: Build Dictionary (${{ matrix.dictionary.name }})
    needs: [create-release]
    strategy:
      matrix:
        dictionary:
          - name: "lindera-ipadic"
            feature: "embed-ipadic"
          - name: "lindera-unidic"
            feature: "embed-unidic"
          - name: "lindera-sudachidict"
            feature: "embed-sudachidict"
          - name: "lindera-ko-dic"
            feature: "embed-ko-dic"
          - name: "lindera-cc-cedict"
            feature: "embed-cc-cedict"
          - name: "lindera-ipadic-neologd"
            feature: "embed-ipadic-neologd"
          - name: "lindera-jieba"
            feature: "embed-jieba"
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Build dictionary
        run: |
          LINDERA_BUILD_DICTIONARY_CACHE_DIR=dictionaries cargo build -p ${{ matrix.dictionary.name }} --features ${{ matrix.dictionary.feature }}

      - name: Get version
        id: get_version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name=="${{ matrix.dictionary.name }}") | .version')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create artifact
        run: |
          # The build cache directory is keyed on the dictionary format version
          # (see build_embedded_dictionary in lindera-dictionary/src/assets.rs),
          # so derive the suffix from the DICTIONARY_FORMAT_VERSION constant.
          FORMAT_VERSION=$(grep -oP 'DICTIONARY_FORMAT_VERSION: u32 = \K[0-9]+' lindera-dictionary/src/dictionary/metadata.rs)
          cp ${{ matrix.dictionary.name }}/NOTICE.txt "dictionaries/${{ steps.get_version.outputs.version }}-fmt${FORMAT_VERSION}/${{ matrix.dictionary.name }}/"
          cd "dictionaries/${{ steps.get_version.outputs.version }}-fmt${FORMAT_VERSION}"
          zip -r ../../${{ matrix.dictionary.name }}-${{ steps.get_version.outputs.version }}.zip ${{ matrix.dictionary.name }}

      - name: Upload artifact
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ matrix.dictionary.name }}-${{ steps.get_version.outputs.version }}.zip
          tag_name: ${{ github.ref_name }}

      - name: Upload dictionary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.dictionary.name }}
          path: dictionaries/

  build:
    name: Build binaries for ${{ matrix.platform.target }}
    needs: [create-release]
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: .zip
            extension: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: .zip
            extension: ""
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: .zip
            extension: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: .zip
            extension: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: .zip
            extension: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: .zip
            extension: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: .zip
            extension: .exe
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            archive: .zip
            extension: .exe
        toolchain: [stable]

    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.platform.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Add msbuild to PATH
        if: startsWith(matrix.platform.runner, 'windows')
        uses: microsoft/setup-msbuild@v3

      # lindera-cli is pure Rust, so rustc's self-contained linking can build the musl
      # targets without an external musl toolchain. Install musl-tools anyway so the
      # build keeps working if a C dependency is ever introduced.
      - name: Install musl tools
        if: endsWith(matrix.platform.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Compile
        run: cargo build -p lindera-cli --release --target=${{ matrix.platform.target }}

      # Asset file names use the bare crate version (e.g. 5.1.0) to match the
      # dictionary archives and the ecosystem-fixed gem/wheel names, while the
      # release tag itself stays v-prefixed. `shell: bash` keeps this step
      # working on the Windows matrix entries.
      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name=="lindera-cli") | .version')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create artifact for Unix
        if: "!startsWith(matrix.platform.runner, 'windows')"
        run: zip --junk-paths lindera-${{ matrix.platform.target }}-${{ steps.get_version.outputs.version }}${{ matrix.platform.archive }} target/${{ matrix.platform.target }}/release/lindera${{ matrix.platform.extension }}

      - name: Create artifact for Windows
        if: startsWith(matrix.platform.runner, 'windows')
        run: powershell Compress-Archive -DestinationPath lindera-${{ matrix.platform.target }}-${{ steps.get_version.outputs.version }}${{ matrix.platform.archive }} -Path target/${{ matrix.platform.target }}/release/lindera${{ matrix.platform.extension }}

      - name: Upload artifact
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: lindera-${{ matrix.platform.target }}-${{ steps.get_version.outputs.version }}${{ matrix.platform.archive }}
          tag_name: ${{ github.ref_name }}

  build-python-wheels:
    name: Build wheels for ${{ matrix.platform.target }}
    needs: [create-release]
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.10 --manifest-path lindera-python/Cargo.toml
          sccache: "true"
          manylinux: auto
          before-script-linux: |
            if command -v yum >/dev/null 2>&1; then
              yum install openssl-devel devtoolset-10-libatomic-devel perl-IPC-Cmd -y
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install libssl-dev pkg-config -y
            fi

      - name: Upload artifact
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}

      - name: Upload to workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-lindera-python-${{ runner.os }}-${{ matrix.platform.target }}-${{ github.ref_name }}
          path: dist
          if-no-files-found: error

  build-python-sdist:
    name: Build sdist
    needs: [test-lindera-python, create-release]
    # Runs after the release exists on a tag push, and as a dry run on
    # workflow_dispatch from a branch, so that a broken sdist shows up before
    # the tag is cut: nothing else builds it, and publish-pypi holds back the
    # wheels too when this job fails. The result checks mirror
    # build-php-binaries (see the comment there). The sdist is attached to the
    # GitHub Release only on a tag.
    if: ${{ !cancelled() && needs.test-lindera-python.result == 'success' && (needs.create-release.result == 'success' || (needs.create-release.result == 'skipped' && !startsWith(github.ref, 'refs/tags/'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path lindera-python/Cargo.toml

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # The oldest Python the abi3 wheels support (see build-python-wheels).
          python-version: "3.10"

      - name: Check sdist
        id: sdist
        # PyPI rejects an sdist whose PKG-INFO lists a License-File that is not
        # at that path under the sdist's top directory (PEP 639). `maturin
        # upload` does not send License-File, so PyPI skips that check for it,
        # but twine and uv publish do send it. Run the same check here so that
        # such an sdist never reaches PyPI, whichever tool uploads it.
        shell: bash
        run: |
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one sdist in dist/, found ${#sdists[@]}"
            exit 1
          fi
          python - "${sdists[0]}" <<'EOF'
          import email.parser
          import os
          import sys
          import tarfile

          sdist = sys.argv[1]
          with tarfile.open(sdist) as tar:
              names = set(tar.getnames())
              top = os.path.commonpath(names)
              metadata = email.parser.BytesParser().parse(tar.extractfile(f"{top}/PKG-INFO"))
          license_files = metadata.get_all("License-File", [])
          if not license_files:
              print(f"::error::{sdist}: PKG-INFO lists no License-File")
              sys.exit(1)
          missing = [path for path in license_files if f"{top}/{path}" not in names]
          for path in missing:
              print(f"::error::{sdist}: PKG-INFO lists License-File {path}, but there is no {top}/{path}")
          sys.exit(1 if missing else 0)
          EOF
          echo "path=${sdists[0]}" >> "${GITHUB_OUTPUT}"

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install sdist outside the repository
        # pip builds this sdist on every platform without a wheel, so check that
        # it builds on its own before anything is published: a build inside the
        # checkout can hide files missing from the package. pip unpacks the
        # sdist into a temporary directory, where cargo sees only what the sdist
        # contains. LTO is turned off only to keep the job short; it does not
        # change what the sdist must contain.
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          SDIST: ${{ steps.sdist.outputs.path }}
        run: |
          venv="${RUNNER_TEMP}/sdist-venv"
          python -m venv "${venv}"
          "${venv}/bin/python" -m pip install "${SDIST}"
          "${venv}/bin/python" -c "import lindera; print('lindera', lindera.version())"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}

      - name: Upload to workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          # No github.ref_name in the name: on a dry run from a branch such as
          # fix/foo it would add a slash, which artifact names cannot contain.
          name: sdist-lindera-python
          path: dist
          if-no-files-found: error

  # One source gem for every platform: `gem install` compiles the extension
  # (see lindera-ruby/extconf.rb), so there is nothing platform-specific to
  # build here. `rake build` packages the crate as `cargo package` normalizes
  # it, with lindera and lindera-binding-core pinned to crates.io releases of
  # this version.
  build-ruby-gem:
    name: Build Ruby gem
    needs: [create-release]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: lindera-ruby

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Update gem version
        working-directory: lindera-ruby
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/spec.version = \".*\"/spec.version = \"${VERSION}\"/" lindera.gemspec
          rm -f lindera.gemspec.bak

      # Fails when the gem version (from the tag) differs from the crate version.
      - name: Build gem
        working-directory: lindera-ruby
        shell: bash
        run: |
          bundle install --quiet
          bundle exec rake build

      - name: Upload gem artifact
        uses: actions/upload-artifact@v7
        with:
          name: gem-lindera-${{ github.ref_name }}
          path: lindera-ruby/pkg/*.gem
          if-no-files-found: error

  # Installs the gem the way users will once it is on RubyGems: `gem install`
  # compiles it against the crates publish-crates has just released. Linux runs
  # in a bare ruby container, so a prerequisite missing from the docs would
  # fail it; macOS installs into an empty GEM_HOME. Both use a current Ruby and
  # the latest stable Rust, so the documented minimums (Ruby 3.1, Rust 1.88)
  # are not tested. publish-rubygems attaches the gem to the GitHub Release and
  # pushes it to RubyGems only after every leg passes.
  test-ruby-gem:
    name: Test Ruby gem install (${{ matrix.platform.name }})
    needs: [build-ruby-gem, publish-crates]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            container: true
          - name: darwin-arm64
            runner: macos-latest
            container: false
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Download gem artifact
        uses: actions/download-artifact@v8
        with:
          name: gem-lindera-${{ github.ref_name }}
          path: gems

      - name: Install gem in a clean ruby container and tokenize
        if: ${{ matrix.platform.container }}
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD/gems:/gems:ro" \
            -v "$PWD/lindera-ruby/test/gem:/test:ro" \
            ruby:3.3 \
            bash /test/install_and_test.sh --setup "/gems/lindera-${GITHUB_REF_NAME#v}.gem"

      - name: Setup Ruby
        if: ${{ !matrix.platform.container }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Set up Rust
        if: ${{ !matrix.platform.container }}
        uses: ./.github/actions/setup-rust

      - name: Install gem into an empty GEM_HOME and tokenize
        if: ${{ !matrix.platform.container }}
        shell: bash
        run: |
          export GEM_HOME="$RUNNER_TEMP/gem-home"
          bash lindera-ruby/test/gem/install_and_test.sh "gems/lindera-${GITHUB_REF_NAME#v}.gem"

  build-php-binaries:
    name: Build PIE binary (php${{ matrix.php-version }}-${{ matrix.platform.arch }}-${{ matrix.platform.os }}-${{ matrix.ts }})
    needs: [test-lindera-php, create-release]
    # Runs after the release exists on a tag push, and as a dry run on
    # workflow_dispatch from a branch. create-release is tag-gated and ends
    # up `skipped` on a dispatch, which the implicit success() would treat
    # as a failure, hence the explicit result checks. `skipped` is accepted
    # only off a tag: on a tag it means another test job failed, and the
    # upload step below would otherwise create the release with nothing but
    # the PHP zips on it. The zips are always uploaded as workflow artifacts
    # and attached to the GitHub Release only on a tag (last step).
    if: ${{ !cancelled() && needs.test-lindera-php.result == 'success' && (needs.create-release.result == 'success' || (needs.create-release.result == 'skipped' && !startsWith(github.ref, 'refs/tags/'))) }}
    strategy:
      # A dry run should report every cell rather than stop at the first
      # failure.
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        ts: [nts, zts]
        platform:
          # arch / os / libc are the segments PIE puts in the asset name
          # (php/pie src/Platform/{Architecture,OperatingSystemFamily,LibcFlavour}.php).
          # macOS is always "bsdlibc" because PIE detects otool, and only
          # Apple silicon is built: setup-php cannot install PHP 8.1-8.4 or
          # a ZTS build on the Intel runners (no x86_64 Homebrew bottles), so
          # Intel Macs fall back to PIE's source build. Linux is built on
          # 22.04 so the module needs no GLIBC symbol newer than 2.35 and
          # loads on Ubuntu 22.04 and Debian 12.
          - runner: ubuntu-22.04
            arch: x86_64
            os: linux
            libc: glibc
          - runner: ubuntu-22.04-arm
            arch: arm64
            os: linux
            libc: glibc
          - runner: macos-latest
            arch: arm64
            os: darwin
            libc: bsdlibc
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
        env:
          phpts: ${{ matrix.ts }}

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Cargo
        # Registry and index only: ext-php-rs bakes the target PHP's headers
        # into the build, so a `target` cache would need one entry per cell
        # and evict everything else under the repository cache cap.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-pie-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install a matching clang and libclang (Linux x86_64)
        # bindgen loads the newest libclang it can find but asks the `clang`
        # driver on PATH for the system include paths. The 22.04 image ships
        # clang 14 on PATH next to libclang 15, so clang 14's emmintrin.h is
        # parsed by a different libclang and the SSE builtins mismatch
        # ("invalid conversion between vector type '__m128i' ... and integer
        # type 'int'"). One LLVM 18 for both sides fixes it; arm64 has no
        # SSE headers and builds with the stock toolchain.
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 18
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"
          echo "CLANG_PATH=/usr/lib/llvm-18/bin/clang" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Install build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v autoconf >/dev/null || brew install autoconf
          command -v glibtoolize >/dev/null || brew install libtool

      - name: Build through phpize (the path PIE runs)
        working-directory: lindera-php
        run: |
          phpize
          ./configure --with-php-config="$(command -v php-config)"
          make LINDERA_CARGO_FLAGS=--locked
          test -f modules/lindera.so

      - name: Verify the module loads and matches the release version
        working-directory: lindera-php
        run: |
          php -n -d extension="$PWD/modules/lindera.so" -m | grep -x lindera
          expected=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "lindera-php") | .version')
          actual=$(php -n -d extension="$PWD/modules/lindera.so" -r 'echo Lindera\Dictionary::version();')
          # PHP_ZTS is an int up to 8.3 and a bool from 8.4, where `echo`
          # prints "" for false; the ternary gives one spelling for both.
          ts=$(php -r 'echo PHP_ZTS ? "zts" : "nts";')
          echo "extension reports $actual, Cargo says $expected, PHP is $ts"
          test "$actual" = "$expected"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$expected" = "$GITHUB_REF_NAME"
          fi
          test "$ts" = "${{ matrix.ts }}"

      - name: Verify the glibc requirement (Linux)
        if: runner.os == 'Linux'
        working-directory: lindera-php
        run: |
          objdump -p modules/lindera.so | awk '/NEEDED/ {print $2}'
          if objdump -p modules/lindera.so | awk '/NEEDED/ {print $2}' | grep -v -E '^(libc|libm|libgcc_s|libpthread|libdl|librt|ld-linux)'; then
            echo "error: unexpected shared-library dependency" >&2
            exit 1
          fi
          max=$(objdump -T modules/lindera.so | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -1)
          echo "highest GLIBC symbol version: $max"
          test "$(printf '%s\n' "${max#GLIBC_}" 2.35 | sort -V | tail -1)" = 2.35

      - name: Verify the dynamic dependencies (macOS)
        if: runner.os == 'macOS'
        working-directory: lindera-php
        run: |
          otool -L modules/lindera.so
          if otool -L modules/lindera.so | tail -n +2 | grep -E '/opt/homebrew/|/usr/local/'; then
            echo "error: linked against a Homebrew library that users need not have" >&2
            exit 1
          fi

      - name: Package the pre-packaged binary for PIE
        id: package
        working-directory: lindera-php
        run: |
          # PIE looks up php_{ext}-{version}_php{X.Y}-{arch}-{os}-{libc}-{nts|zts}.zip
          # on the release for {version} = Composer's pretty version = the
          # git tag (php/pie src/Platform/PrePackagedBinaryAssetName.php),
          # and expects lindera.so at the archive root. A branch dry run has
          # no tag; it uses the Cargo version with a -dev marker.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "lindera-php") | .version')-dev"
          fi
          php_minor=$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')
          ts=$(php -r 'echo PHP_ZTS ? "zts" : "nts";')
          asset=$(echo "php_lindera-${version}_php${php_minor}-${{ matrix.platform.arch }}-${{ matrix.platform.os }}-${{ matrix.platform.libc }}-${ts}.zip" | tr '[:upper:]' '[:lower:]')
          zip -j "$asset" modules/lindera.so
          unzip -l "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: pie-${{ matrix.platform.runner }}-php${{ matrix.php-version }}-${{ matrix.ts }}
          path: lindera-php/${{ steps.package.outputs.asset }}
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: lindera-php/${{ steps.package.outputs.asset }}
          tag_name: ${{ github.ref_name }}

  build-wasm:
    name: Build WASM
    needs: [create-release]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Build WASM
        shell: bash
        run: |
          cd lindera-wasm
          wasm-pack build --release --target web

      - name: Copy JS helpers to pkg
        shell: bash
        run: |
          cp lindera-wasm/js/opfs.js lindera-wasm/pkg/
          cp lindera-wasm/js/opfs.d.ts lindera-wasm/pkg/

      - name: Update package.json
        shell: bash
        run: |
          cd lindera-wasm/pkg
          jq '
            .files += ["opfs.js", "opfs.d.ts"] |
            .exports = {
              ".": {
                "types": "./lindera_wasm.d.ts",
                "default": "./lindera_wasm.js"
              },
              "./opfs": {
                "types": "./opfs.d.ts",
                "default": "./opfs.js"
              }
            }
          ' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg-lindera-wasm
          path: lindera-wasm/pkg

  build-lindera-nodejs:
    name: Build Node.js Native (${{ matrix.platform.target }})
    needs: [create-release]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.platform.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable-${{ matrix.platform.target }}"

      - name: Install dependencies and build
        working-directory: lindera-nodejs
        shell: bash
        run: |
          npm install
          npx napi build --platform --release -p lindera-nodejs --target ${{ matrix.platform.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nodejs-binding-${{ matrix.platform.target }}
          path: lindera-nodejs/*.node
          if-no-files-found: error

  publish-crates:
    name: Publish crates
    needs: [create-release]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Publish crates
        run: |
          # Binding crates (lindera-python, lindera-nodejs, lindera-ruby,
          # lindera-wasm, lindera-php) are not published to crates.io; they are
          # distributed through their own registries (PyPI, npm, RubyGems).
          for crate in lindera-crf lindera-dictionary lindera-trainer lindera-cc-cedict lindera-jieba lindera-ipadic lindera-ipadic-neologd lindera-ko-dic lindera-unidic lindera-sudachidict lindera lindera-analysis lindera-binding-core lindera-cli; do
            VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r ".packages[] | select(.name==\"$crate\") | .version")
            PUBLISHED_VERSIONS=$(curl -s -A "lindera-release-workflow (https://github.com/lindera/lindera)" "https://crates.io/api/v1/crates/$crate" | jq -r 'select(.versions != null) | .versions[].num')
            if echo "${PUBLISHED_VERSIONS}" | grep -Fx "${VERSION}" >/dev/null; then
              echo "$crate $VERSION has already published"
            else
              echo "Publishing $crate $VERSION..."
              pushd $crate
              cargo publish
              popd
              sleep 20
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: [build-python-wheels, build-python-sdist]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist-lindera-python
          path: dist

      - name: Check distributions
        # Upload the wheels and exactly one sdist, and nothing else. Without the
        # sdist, pip on a platform without a wheel finds no distribution at all.
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          files=(dist/*)
          ls -l dist
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one sdist in dist/, found ${#sdists[@]}"
            exit 1
          fi
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "::error::Expected wheels in dist/, found none"
            exit 1
          fi
          if [ "${#files[@]}" -ne $(( ${#wheels[@]} + 1 )) ]; then
            echo "::error::dist/ holds files other than the wheels and the sdist"
            exit 1
          fi

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*

  publish-wasm-npm:
    name: Publish WASM to npm
    needs: [build-wasm]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm-pkg-lindera-wasm
          path: lindera-wasm/pkg

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from Cargo.toml
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name=="lindera-wasm") | .version')
          echo "Syncing npm version to ${VERSION}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('lindera-wasm/pkg/package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('lindera-wasm/pkg/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish to npm
        run: |
          cd lindera-wasm/pkg
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} has already been published, skipping"
          else
            echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION}..."
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  publish-nodejs-npm:
    name: Publish Node.js to npm
    needs: [build-lindera-nodejs]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download all Node.js binding artifacts
        uses: actions/download-artifact@v8
        with:
          path: lindera-nodejs/artifacts
          pattern: "nodejs-binding-*"
          merge-multiple: true

      - name: Sync version from Cargo.toml
        working-directory: lindera-nodejs
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name=="lindera-nodejs") | .version')
          echo "Syncing npm version to ${VERSION}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${VERSION}';
            if (pkg.optionalDependencies) {
              for (const key of Object.keys(pkg.optionalDependencies)) {
                pkg.optionalDependencies[key] = '${VERSION}';
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        working-directory: lindera-nodejs
        run: npm install

      - name: Prepare npm packages
        working-directory: lindera-nodejs
        run: |
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts

      # The root cause of #832 was that nothing ever inspected what was being shipped: the main
      # package published for three releases containing only package.json and README.md. Assert the
      # entry points are actually in the tarball BEFORE publishing, so a packaging regression fails
      # the release instead of reaching the registry.
      - name: Verify tarball contents
        working-directory: lindera-nodejs
        shell: bash
        run: |
          FILES=$(npm pack --dry-run --json | jq -r '.[0].files[].path')
          echo "${FILES}"
          for required in index.js index.d.ts; do
            if ! echo "${FILES}" | grep -Fxq "${required}"; then
              echo "::error::${required} is missing from the package tarball; refusing to publish."
              exit 1
            fi
          done

      - name: Publish to npm
        working-directory: lindera-nodejs
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} has already been published, skipping"
            exit 0
          fi

          # Publish platform-specific packages first
          for dir in npm/*/; do
            if [ -f "${dir}package.json" ]; then
              PKG=$(node -p "require('./${dir}package.json').name")
              PKG_VER=$(node -p "require('./${dir}package.json').version")
              if npm view "${PKG}@${PKG_VER}" version 2>/dev/null; then
                echo "${PKG}@${PKG_VER} already published, skipping"
              else
                echo "Publishing ${PKG}@${PKG_VER}..."
                pushd "${dir}"
                npm publish --access public
                popd
              fi
            fi
          done

          # Publish the main package
          npm publish --access public

  # The gem compiles against crates.io at install time, so it is published only
  # after publish-crates (through test-ruby-gem, which needs it).
  publish-rubygems:
    name: Publish to RubyGems
    needs: [test-ruby-gem]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Download gem artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gem-*
          merge-multiple: true
          path: gems

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: gems/*.gem
          tag_name: ${{ github.ref_name }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}
        run: |
          for gem in gems/*.gem; do
            echo "Publishing ${gem}..."
            gem_name=$(basename "${gem}" .gem | sed 's/-[0-9].*//')
            gem_version=$(basename "${gem}" .gem | grep -oP '\d+\.\d+\.\d+')
            if gem search "^${gem_name}$" --versions --exact | grep -q "${gem_version}"; then
              echo "${gem_name} ${gem_version} already published, skipping"
            else
              gem push "${gem}"
            fi
          done
