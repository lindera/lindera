[package]
name = "lindera-dependency"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Japanese bunsetsu dependency analysis for Lindera."
documentation = "https://docs.rs/lindera-dependency"
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"
keywords = ["dependency", "parsing", "bunsetsu", "japanese", "cabocha"]
categories = { workspace = true }
license = { workspace = true }

[features]
default = []
# The tools around the parser: the `corpus` module, which makes training
# data (#1419), the `evaluation` module (#1420), the training of the chunker
# with lindera-crf (#1421) and of the parser (#1437). The command that runs
# them is `lindera dependency`, in lindera-cli (#1482).
train = ["dep:lindera-crf"]
# Embeds the model for IPADIC, for `embedded::model("ipadic")` and
# `--model embedded://ipadic`: the one a release of Lindera publishes, or
# the file LINDERA_BUILD_DEPENDENCY_MODEL_IPADIC_FILE names (#1440). It
# brings a build dependency, and no dependency of the library.
embed-model-ipadic = ["dep:lindera-dictionary"]
# The same for the models for UniDic (#1441): `embedded://unidic`,
# `embedded://unidic-cwj` and `embedded://unidic-csj`, and the files
# LINDERA_BUILD_DEPENDENCY_MODEL_UNIDIC_FILE,
# LINDERA_BUILD_DEPENDENCY_MODEL_UNIDIC_CWJ_FILE and
# LINDERA_BUILD_DEPENDENCY_MODEL_UNIDIC_CSJ_FILE.
embed-model-unidic = ["dep:lindera-dictionary"]
embed-model-unidic-cwj = ["dep:lindera-dictionary"]
embed-model-unidic-csj = ["dep:lindera-dictionary"]

# No dependency in the default build: the core takes any sequence of
# morphemes, and has to build without a tokenizer or a dictionary, for
# wasm32-unknown-unknown as well (`make check-lindera-dependency`).
#
# The crate is a library only, and depends on no tokenizer with any
# feature: the command is `lindera dependency`, in lindera-cli (#1482).
# lindera-analysis depends on this crate for the token filter, behind its
# `dependency` feature (#1438), so this crate must never depend on
# lindera-segmenter, on lindera-analysis or on the lindera facade.
[dependencies]
lindera-crf = { workspace = true, optional = true, features = ["train"] }

# Only for the build script, and only with a feature that embeds a model:
# the download and the check of a published archive.
[build-dependencies]
lindera-dictionary = { workspace = true, optional = true, features = ["build_rs"] }

[dev-dependencies]
tempfile = "3.27.0"
