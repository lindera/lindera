[package]
name = "lindera-dependency"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Japanese bunsetsu dependency analysis for Lindera."
documentation = "https://docs.rs/lindera-dependency"
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"
keywords = ["dependency", "parsing", "bunsetsu", "japanese", "cabocha"]
categories = { workspace = true }
license = { workspace = true }
# Not published before it has a model to parse with (#1418): the workspace
# publishes every crate at one version, and this one would be of no use yet.
publish = false

[features]
default = []
# The tools around the parser: the `corpus` module, which makes training data
# (#1419), the `evaluation` module (#1420), the training of the chunker with
# lindera-crf (#1421), and the `lindera-dependency` command, which tokenizes
# with Lindera.
train = ["dep:clap", "dep:lindera-crf", "dep:lindera-segmenter", "dep:serde_json"]
# Embeds IPADIC in the command, for `--dict embedded://ipadic`.
embed-ipadic = ["train", "lindera-segmenter/embed-ipadic"]

# No dependency in the default build: the core takes any sequence of
# morphemes, and has to build without a tokenizer or a dictionary, for
# wasm32-unknown-unknown as well (`make check-lindera-dependency`).
#
# Behind `train`, the command depends on lindera-segmenter and on nothing
# above it: lindera-analysis is to depend on this crate for the token filter
# (#1417), so this crate must never depend on lindera-analysis or on the
# lindera facade.
[dependencies]
clap = { version = "4.6.4", features = ["derive", "cargo"], optional = true }
lindera-crf = { workspace = true, optional = true, features = ["train"] }
lindera-segmenter = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "lindera-dependency"
path = "src/bin/lindera-dependency.rs"
required-features = ["train"]
