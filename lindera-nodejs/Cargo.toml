[package]
name = "lindera-nodejs"
# Distributed via npm, not crates.io.
publish = false
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "A Node.js binding for Lindera."
documentation = "https://docs.rs/lindera-nodejs"
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"
keywords = ["morphological", "analysis", "library", "nodejs", "binding"]
categories = { workspace = true }
license = { workspace = true }

[lib]
crate-type = ["cdylib", "lib"]

[features]
embed-ipadic = ["lindera/embed-ipadic"] # Include Japanese dictionary (IPADIC)
embed-ipadic-neologd = [
    "lindera/embed-ipadic-neologd",
] # Include Japanese dictionary (IPADIC NEologd)
embed-unidic = ["lindera/embed-unidic"] # Include Japanese dictionary (UniDic)
embed-sudachidict = [
    "lindera/embed-sudachidict",
] # Include Japanese dictionary (SudachiDict)
embed-ko-dic = ["lindera/embed-ko-dic"] # Include Korean dictionary (ko-dic)
embed-cc-cedict = [
    "lindera/embed-cc-cedict",
] # Include Chinese dictionary (CC-CEDICT)
embed-jieba = ["lindera/embed-jieba"] # Include Chinese dictionary (Jieba)
embed-cjk = [
    "lindera/embed-cjk",
] # Embed CJK dictionaries (IPADIC, ko-dic, Jieba)
train = ["lindera/train"] # Enable training functionality
# For tests only, never for a release build: exports `__panicForTest`, which
# panics, so that tests/test_panic.js can check that a panic throws an
# `Error` instead of aborting Node.js (#1314). `make test-lindera-nodejs`
# enables it through NODEJS_TEST_FEATURES.
test-hooks = []
default = ["train"] # Training enabled by default

[dependencies]
lindera = { workspace = true }
lindera-binding = { workspace = true }
napi = { version = "3.11.0", features = ["napi8", "serde-json"] }
napi-derive = "3.6.0"
num_cpus = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# Parses the sources in the test that every `#[napi]` function and method
# carries `catch_unwind` (src/lib.rs).
syn = { version = "2.0", features = ["full"] }

[build-dependencies]
napi-build = "2.3.2"
napi-derive-backend = "7.0.0"
